<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shared Calendar</title>

    <!-- CSS -->
    <link rel="stylesheet" href="calendar.css" />

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>

  <body>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Shared Calendar</h2>
      </div>

      <ul>
        <li><span class="material-icons"> calendar_month </span>カレンダー</li>
        <li><span class="material-icons"> groups </span>グループ予定</li>
        <li><span class="material-icons"> person </span>個人予定</li>
        <li><span class="material-icons"> settings </span>設定</li>
      </ul>
    </aside>

    <div id="sidebarOverlay" class="overlay"></div>

    <header class="header">
      <div class="header-left">
        <button id="menuBtn" class="icon-btn">
          <span class="material-icons"> menu </span>
        </button>
        <h1>Shared Calendar</h1>
      </div>

      <div class="header-right">
        <button id="todayBtn" class="today-btn">今月</button>
        <button id="scheduleListBtn" class="icon-btn" title="予定一覧">
          <span class="material-icons"> list </span>
        </button>

        <!-- 通知ON/OFF -->
        <button id="notifyToggleBtn" class="icon-btn" title="通知ON/OFF">
          <span id="notifyToggleIcon" class="material-icons"> notifications </span>
        </button>

        <!-- 通知履歴（ON/OFFの横） -->
        <button id="notificationHistoryBtn" class="icon-btn" title="通知履歴">
          <span class="material-icons"> history </span>
        </button>

        <button id="notificationSettingsBtn" class="icon-btn" title="通知設定">
          <span class="material-icons"> tune </span>
        </button>

        <button id="themeBtn" class="icon-btn" title="ダークモード">
          <span class="material-icons"> dark_mode </span>
        </button>
      </div>
    </header>

    <section class="calendar-nav">
      <button id="prevBtn" class="nav-btn">
        <span class="material-icons"> chevron_left </span>
      </button>

      <h2 id="currentTitle">2026年6月</h2>

      <button id="nextBtn" class="nav-btn">
        <span class="material-icons"> chevron_right </span>
      </button>
    </section>

    <section class="view-switch">
      <button id="monthViewBtn" class="view-btn active">月</button>
      <button id="weekViewBtn" class="view-btn">週</button>
      <button id="dayViewBtn" class="view-btn">日</button>
    </section>

    <section id="weekHeader" class="week-header">
      <div class="sun">日</div>
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div class="sat">土</div>
    </section>

    <main id="monthView" class="month-view"></main>
    <main id="weekView" class="week-view hidden"></main>
    <main id="dayView" class="day-view hidden"></main>

    <button id="addEventBtn" class="fab">
      <span class="material-icons"> add </span>
    </button>

    <div id="eventModal" class="modal">
      <div class="modal-content">
        <h2>予定登録</h2>

        <input
          type="text"
          id="eventTitle"
          maxlength="100"
          placeholder="タイトル"
        />

        <label>開始日時</label>
        <input type="datetime-local" id="eventStart" />

        <label>終了日時</label>
        <input type="datetime-local" id="eventEnd" />

        <label class="checkbox">
          <input type="checkbox" id="allDay" />
          終日予定
        </label>

        <label>予定の種類</label>
        <select id="eventType">
          <option value="event">通常予定</option>
          <option value="task">タスク</option>
          <option value="mail">メール送信リマインド</option>
        </select>

        <div class="event-extra-options">
          <label>通知タイミング</label>
          <div class="inline-checks">
            <label class="checkbox compact-checkbox">
              <input type="checkbox" id="remind30" />
              30分前
            </label>
            <label class="checkbox compact-checkbox">
              <input type="checkbox" id="remind5" />
              5分前
            </label>
            <label class="checkbox compact-checkbox">
              <input type="checkbox" id="remindStart" />
              開始/期限時刻
            </label>
          </div>
          <input
            type="number"
            id="customReminderMinutes"
            min="1"
            max="10080"
            placeholder="カスタム通知（分前）"
          />
        </div>

        <div id="taskOptions" class="event-extra-options hidden">
          <label class="checkbox">
            <input type="checkbox" id="taskDeadlineNotify" />
            タスク期限通知を行う
          </label>
        </div>

        <div id="mailOptions" class="event-extra-options hidden">
          <label class="checkbox">
            <input type="checkbox" id="mailReminderEnabled" />
            メール送信リマインドを行う
          </label>
          <input type="text" id="mailTo" maxlength="100" placeholder="宛先メモ" />
          <input type="text" id="mailSubject" maxlength="100" placeholder="件名" />
          <label>通知日時</label>
          <input type="datetime-local" id="mailRemindAt" />
          <label class="checkbox">
            <input type="checkbox" id="mailSent" />
            送信済み
          </label>
        </div>

        <select id="eventVisibility">
          <option value="public">全体公開</option>
          <option value="group">グループ公開</option>
          <option value="private">自分のみ</option>
        </select>

        <textarea id="eventMemo" rows="5" placeholder="メモ"></textarea>

        <div class="modal-actions">
          <button id="saveEventBtn">保存</button>
          <button id="deleteEventBtn">削除</button>
          <button id="closeModalBtn">閉じる</button>
        </div>
      </div>
    </div>

    <div id="listModal" class="modal">
      <div class="modal-content list-modal">
        <h2>予定一覧</h2>

        <div class="list-mode">
          <button data-filter="day">日</button>
          <button data-filter="week">週</button>
          <button data-filter="month">月</button>
        </div>

        <div id="scheduleList"></div>

        <button id="closeListBtn">閉じる</button>
      </div>
    </div>

    <!-- 通知履歴モーダル -->
    <div id="notificationHistoryModal" class="modal">
      <div class="modal-content list-modal">
        <h2>通知履歴</h2>

        <div id="notificationHistoryList" style="max-height: 400px; overflow: auto;"></div>

        <div class="modal-actions" style="margin-top: 10px;">
          <button id="clearNotificationHistoryBtn">履歴を全削除</button>
          <button id="closeNotificationHistoryBtn">閉じる</button>
        </div>
      </div>
    </div>

    <!-- 通知設定モーダル -->
    <div id="notificationSettingsModal" class="modal">
      <div class="modal-content list-modal wide-modal">
        <h2>通知設定</h2>

        <label class="checkbox">
          <input type="checkbox" id="settingsNotificationEnabled" />
          通知を有効にする
        </label>

        <label class="checkbox">
          <input type="checkbox" id="settingsTaskDeadlineEnabled" />
          タスク期限通知を有効にする
        </label>

        <label class="checkbox">
          <input type="checkbox" id="settingsMailReminderEnabled" />
          メール送信リマインドを有効にする
        </label>

        <label>既定の通知タイミング</label>
        <div class="inline-checks settings-checks">
          <label class="checkbox compact-checkbox">
            <input type="checkbox" id="settingsRemind30" />
            30分前
          </label>
          <label class="checkbox compact-checkbox">
            <input type="checkbox" id="settingsRemind5" />
            5分前
          </label>
          <label class="checkbox compact-checkbox">
            <input type="checkbox" id="settingsRemindStart" />
            開始/期限時刻
          </label>
        </div>
        <input
          type="number"
          id="settingsCustomReminderMinutes"
          min="1"
          max="10080"
          placeholder="既定のカスタム通知（分前）"
        />

        <label>通知履歴の保持日数</label>
        <input type="number" id="settingsHistoryRetentionDays" min="1" max="365" />

        <div class="modal-actions">
          <button id="saveNotificationSettingsBtn">保存</button>
          <button id="closeNotificationSettingsBtn">閉じる</button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading hidden">読み込み中...</div>

    <script src="calendar.js"></script>
  </body>
</html>
