<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<style>
body{
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}
.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
}
button{
    width:100%;
    padding:10px;
}
.google{
    background:#4285F4;
    color:white;
}
</style>
</head>
<body>

<div class="container">
    <h2>ログイン</h2>

    <input type="email" placeholder="メールアドレス">

    <input type="password" placeholder="パスワード">

    <button>ログイン</button>

    <br><br>

    <button class="google">
        Googleでログイン
    </button>

    <p>
        <a href="register.html">新規登録</a>
    </p>

    <p>
        <a href="reset-password.html">
            パスワードを忘れた方
        </a>
    </p>
</div>

</body>
</html>
