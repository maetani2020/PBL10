<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shared Calendar</title>

    <link rel="stylesheet" href="calendar.css" />

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- サイドバー -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Shared Calendar</h2>
        <p id="sidebarUserId" class="sidebar-user"></p>
      </div>

      <ul>
        <li class="sidebar-item active" data-nav="calendar">
          <span class="material-icons">calendar_month</span>
          カレンダー
        </li>
        <li class="sidebar-item" data-nav="group">
          <span class="material-icons">groups</span>
          グループ予定
        </li>
        <li class="sidebar-item" data-nav="private">
          <span class="material-icons">person</span>
          個人予定
        </li>
        <li class="sidebar-item" data-nav="stats">
          <span class="material-icons">show_chart</span>
          HP統計
        </li>
        <li class="sidebar-item" data-nav="settings">
          <span class="material-icons">settings</span>
          設定
        </li>
      </ul>
    </aside>

    <div id="sidebarOverlay" class="overlay"></div>

    <!-- ヘッダー -->
    <header class="header">
      <div class="header-left">
        <button id="menuBtn" class="icon-btn">
          <span class="material-icons">menu</span>
        </button>
        <h1>Shared Calendar</h1>
      </div>

      <div id="headerGauges" class="header-gauges">
        <div class="gauge-item">
          <span class="gauge-label">HP</span>
          <div class="gauge-bar">
            <div id="headerHpBar" class="gauge-fill hp-green" style="width:100%"></div>
          </div>
          <span id="headerHpText" class="gauge-value">100%</span>
        </div>
        <div class="gauge-item">
          <span class="gauge-label">やる気</span>
          <div class="gauge-bar">
            <div id="headerMotivationBar" class="gauge-fill motivation-green" style="width:100%"></div>
          </div>
          <span id="headerMotivationText" class="gauge-value">100%</span>
        </div>
      </div>

      <div class="header-right">
        <button id="groupManageBtn" class="icon-btn" title="グループ管理">
          <span class="material-icons">group_add</span>
        </button>
        <button id="todayBtn" class="today-btn">今月</button>
        <button id="scheduleListBtn" class="icon-btn">
          <span class="material-icons">list</span>
        </button>
        <button id="themeBtn" class="icon-btn">
          <span class="material-icons">dark_mode</span>
        </button>
      </div>
    </header>

    <!-- ナビゲーション -->
    <section class="calendar-nav">
      <button id="prevBtn" class="nav-btn">
        <span class="material-icons">chevron_left</span>
      </button>
      <h2 id="currentTitle">2026年6月</h2>
      <button id="nextBtn" class="nav-btn">
        <span class="material-icons">chevron_right</span>
      </button>
    </section>

    <!-- 表示切替 -->
    <section class="view-switch">
      <button id="monthViewBtn" class="view-btn active">月</button>
      <button id="weekViewBtn" class="view-btn">週</button>
      <button id="dayViewBtn" class="view-btn">日</button>
    </section>

    <!-- 表示オプション（チェックリスト） -->
    <section class="display-options">
      <label class="display-option">
        <input type="checkbox" id="showHpMotivation" />
        HP・やる気を表示
      </label>
    </section>

    <!-- フィルタバナー -->
    <div id="filterBanner" class="filter-banner hidden"></div>

    <!-- 曜日 -->
    <section id="weekHeader" class="week-header">
      <div class="sun">日</div>
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div class="sat">土</div>
    </section>

    <!-- 月表示 -->
    <main id="monthView" class="month-view"></main>

    <!-- 週表示 -->
    <main id="weekView" class="week-view hidden"></main>

    <!-- 日表示 -->
    <main id="dayView" class="day-view hidden"></main>

    <!-- 統計パネル -->
    <section id="statsPanel" class="stats-panel hidden">
      <h3>HP・やる気 週間推移</h3>
      <div id="statsChart" class="stats-chart"></div>
      <h3>消費履歴（選択日）</h3>
      <div id="historyPanel" class="history-panel"></div>
    </section>

    <button id="addEventBtn" class="fab">
      <span class="material-icons">add</span>
    </button>

    <!-- 予定登録モーダル -->
    <div id="eventModal" class="modal">
      <div class="modal-content event-modal">
        <h2>予定登録</h2>

        <div class="modal-body">
          <div id="preSaveWarning" class="alert-box hidden"></div>

          <input type="text" id="eventTitle" maxlength="100" placeholder="タイトル" />

          <label>開始日時</label>
          <input type="datetime-local" id="eventStart" />

          <label>終了日時</label>
          <input type="datetime-local" id="eventEnd" />

          <label class="checkbox">
            <input type="checkbox" id="allDay" />
            終日予定
          </label>

          <label>公開範囲</label>
          <select id="eventVisibility">
            <option value="public">全体公開</option>
            <option value="group">グループ公開</option>
            <option value="private">自分のみ</option>
          </select>

          <div id="groupSelectWrap" class="hidden">
            <label>グループ</label>
            <select id="eventGroupId"></select>
          </div>

          <label>HP消費率 (%)</label>
          <input type="number" id="hpCost" min="0" max="100" value="0" />

          <label>やる気消費率 (%)</label>
          <input type="number" id="motivationCost" min="0" max="100" value="0" />

          <div id="restSuggestions" class="rest-suggestions hidden"></div>

          <textarea id="eventMemo" rows="3" placeholder="メモ"></textarea>
        </div>

        <div class="modal-actions">
          <button id="saveEventBtn">保存</button>
          <button id="deleteEventBtn">削除</button>
          <button id="closeModalBtn">閉じる</button>
        </div>
      </div>
    </div>

    <!-- 予定一覧モーダル -->
    <div id="listModal" class="modal">
      <div class="modal-content list-modal">
        <h2>予定一覧</h2>
        <div class="modal-body">
          <div class="list-mode">
            <button data-filter="day">日</button>
            <button data-filter="week">週</button>
            <button data-filter="month">月</button>
          </div>
          <div id="scheduleList"></div>
        </div>
        <button id="closeListBtn" class="modal-footer-btn">閉じる</button>
      </div>
    </div>

    <!-- グループ管理モーダル -->
    <div id="groupModal" class="modal">
      <div class="modal-content group-modal">
        <h2>グループ管理</h2>

        <div class="modal-body">
        <div class="group-section">
          <h3>グループ作成</h3>
          <input type="text" id="newGroupName" placeholder="グループ名" />
          <button id="createGroupBtn" class="primary-btn">作成</button>
        </div>

        <div class="group-section">
          <h3>所属グループ</h3>
          <div id="groupList"></div>
        </div>

        <div id="groupDetail" class="group-section hidden">
          <h3 id="groupDetailTitle">グループ詳細</h3>
          <div id="memberList"></div>
          <div class="group-actions">
            <input type="text" id="inviteUserId" placeholder="招待するユーザーID" />
            <button id="inviteMemberBtn" class="primary-btn">招待</button>
          </div>
          <div class="group-actions">
            <button id="dissolveGroupBtn" class="danger-btn">グループ解散</button>
            <button id="leaveGroupBtn" class="danger-btn">グループ脱退</button>
          </div>
        </div>
        </div>

        <button id="closeGroupBtn" class="modal-footer-btn">閉じる</button>
      </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="modal">
      <div class="modal-content">
        <h2>ユーザー設定</h2>

        <div class="modal-body">
          <label>ユーザーID</label>
          <input type="text" id="settingsUserId" placeholder="user001" />

          <label>HP上限値</label>
          <input type="number" id="settingsMaxHp" min="1" max="100" value="100" />

          <label>やる気上限値</label>
          <input type="number" id="settingsMaxMotivation" min="1" max="100" value="100" />

          <label>回復率 (0.0〜1.0)</label>
          <input type="number" id="settingsRecoveryRate" min="0" max="1" step="0.1" value="0.8" />

          <label>警告閾値 (%)</label>
          <input type="number" id="settingsWarningThreshold" min="1" max="100" value="80" />
        </div>

        <div class="modal-actions">
          <button id="saveSettingsBtn">保存</button>
          <button id="closeSettingsBtn">閉じる</button>
        </div>
      </div>
    </div>

    <div id="loading" class="loading hidden">読み込み中...</div>

    <script src="calendar.js"></script>
  </body>
</html>
